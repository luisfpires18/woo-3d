; Project-local DDC on D: (owner decision G-2(b)): C: has ~8 GB free.
; The installed-engine graph defaults to ZenLocal (zenserver data under %LOCALAPPDATA%, i.e. C:)
; plus InstalledLocal (%ENGINEVERSIONAGNOSTICUSERDIR%DerivedDataCache, also C:).
; Override: drop the Zen and shared nodes, point the filesystem Local node at <project>/DerivedDataCache.
; No environment variables are used.

[DerivedDataCacheGraphs]
Installed=(ProjectPak, InstalledProjectPak, EnginePak=InstalledEnginePak, EnterprisePak, Local=InstalledLocal)

[DerivedDataCacheStores]
InstalledLocal=(Base=Local, PromptIfMissing=false, Path="%GAMEDIR%DerivedDataCache")

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=4B704DE948309F2A5A5A468C46A6C33E
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
